# ==============================================================================
# GRAFANA CONFIG - grafana.ini (Security Hardened)
# ==============================================================================

[DEFAULT]

[server]
protocol = http
http_port = 3000
domain = your-domain.com    # Thay bằng domain thật
root_url = %(protocol)s://%(domain)s/
serve_from_sub_path = false
enable_gzip = true

[database]
# Dùng SQLite mặc định, đủ cho single server
type = sqlite3
path = grafana.db
# Nếu muốn dùng PostgreSQL:
# type = postgres
# host = postgres:5432
# name = grafana
# user = grafana
# password = your_password

[security]
# Admin credentials được set qua environment variables (GF_SECURITY_ADMIN_*)
# Buộc đổi mật khẩu lần đầu đăng nhập
disable_initial_admin_creation = false
cookie_secure = true          # HTTPS only cookies
cookie_samesite = lax
strict_transport_security = true
strict_transport_security_max_age_seconds = 86400
content_type_protection = true
x_content_type_options = true
x_xss_protection = true

[users]
# SECURITY: Tắt tự đăng ký
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth]
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[auth.anonymous]
# SECURITY: Tắt truy cập ẩn danh
enabled = false

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[smtp]
# Cấu hình qua environment variables GF_SMTP_*
# enabled = true/false được set qua env

[log]
mode = console
level = warn

[metrics]
enabled = true
interval_seconds = 10

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[dashboards]
# default_home_dashboard_path = /var/lib/grafana/dashboards/server-overview.json
min_refresh_interval = 30s

[unified_alerting]
enabled = true

[feature_toggles]
# Bật các features hữu ích
enable = ngalert

[paths]
data = /var/lib/grafana
temp_data_lifetime = 24h
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
