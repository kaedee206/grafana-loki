# ==============================================================================
# LOKI CONFIG - loki-config.yml
# Log aggregation với auth và retention policy
# ==============================================================================

auth_enabled: false   # Đặt true nếu cần multi-tenant (single server = false ok)

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Giới hạn để tránh abuse
limits_config:
  # Retention: xóa logs sau 30 ngày
  retention_period: 720h    # 30 ngày
  # Rate limits
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_line_size: 256KB
  max_entries_limit_per_query: 5000
  max_global_streams_per_user: 10000
  # Query timeout
  query_timeout: 2m

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  compaction_interval: 10m

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false   # Không gửi dữ liệu về Grafana Labs
