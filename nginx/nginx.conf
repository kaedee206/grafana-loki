# ==============================================================================
# NGINX CONFIG - Cloudflare Tunnel Mode
# SSL được xử lý bởi Cloudflare (tunnel), Nginx chỉ serve HTTP nội bộ
# Traffic flow: User → Cloudflare HTTPS → Tunnel → Nginx HTTP → Grafana
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- SECURITY: Ẩn Nginx version ----
    server_tokens off;

    # ---- LOGGING ----
    # Dùng X-Forwarded-For từ Cloudflare để log IP thật của user
    log_format main '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---- PERFORMANCE ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ---- RATE LIMITING ----
    # Dùng $http_x_forwarded_for thay $binary_remote_addr vì traffic qua Cloudflare
    limit_req_zone $http_x_forwarded_for zone=grafana_login:10m rate=5r/s;
    limit_req_zone $http_x_forwarded_for zone=general:10m rate=20r/s;
    limit_conn_zone $http_x_forwarded_for zone=conn_limit:10m;

    # ==========================================
    # SERVER: HTTP (Cloudflare Tunnel kết nối vào đây)
    # ==========================================
    server {
        listen 80;
        server_name server.kaedeemc.com kaedeemc.com;

        # ---- SECURITY HEADERS ----
        # Cloudflare đã handle HTTPS, nhưng vẫn set headers quan trọng
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://cloudflareinsights.com;" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---- RATE LIMITING ----
        limit_req zone=general burst=40 nodelay;
        limit_conn conn_limit 20;

        # ---- PROXY TO GRAFANA ----
        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            # Lấy IP thật từ Cloudflare header
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Báo Grafana biết upstream là HTTPS

            # WebSocket support cho Grafana Live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ---- RATE LIMIT CHO LOGIN ENDPOINT ----
        location /login {
            limit_req zone=grafana_login burst=10 nodelay;
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ---- HEALTH CHECK ENDPOINT ----
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ---- BLOCK CÁC PATH NHẠY CẢM ----
        location ~ /\.ht {
            deny all;
        }
        location ~ /\.git {
            deny all;
        }
    }
}
