# ==============================================================================
# PROMETHEUS WEB CONFIG - web.yml
# TLS và Basic Auth cho Prometheus web UI (internal access)
# ==============================================================================

# Basic auth - bảo vệ Prometheus UI khi truy cập nội bộ
basic_auth_users:
  # Tạo hash: htpasswd -nBC 10 "" | tr -d ':\n'
  # Thay CHANGE_ME_BCRYPT_HASH bằng hash thật từ lệnh trên
  prometheus: "$2y$10$g0bGOM6STs.cY2WycUxgbe0XTK8HEA67tTFWx2rJRnT3xVQpV2KaG"

# Nếu muốn bật TLS nội bộ (optional, vì đã có Nginx làm TLS termination):
# tls_server_config:
#   cert_file: /etc/prometheus/tls/server.crt
#   key_file: /etc/prometheus/tls/server.key
#   min_version: TLS12
#   cipher_suites:
#     - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
#     - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
